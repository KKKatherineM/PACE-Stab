seed: 42
esm:
  checkpoint: esm2_t33_650M_UR50D
  layers: 33
  prefix_last_layer: 31
lora:
  enabled: true
  last_n_layers: 2
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
  - query
  - value
cache:
  dtype: float16
  sequences_per_shard: 128
  root: cache/esm_prefix
data:
  cache_mode: disk
  rolling_ram_shards: 16
  ram_safety_fraction: 0.2
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  wt_aware_batching: true
  length_bucket_width: 4
training:
  optimizer: Adam
  fusion_learning_rate: 3.0e-05
  lora_learning_rate: 1.0e-05
  weight_decay: 1.0e-05
  dropout: 0.34286607675377345
  batch_size: 32
  gradient_accumulation_steps: 1
  max_epochs: 200
  patience: 10
  minimum_epochs: 20
  use_amp: true
  log_every_batches: 100
paths:
  manifests_root: data/manifests
  s669_csv: data/manifests/s669.csv.gz
  pythia_feature_root: cache/pythia_site
pythia_checkpoints:
  42: checkpoints/training_prior/best_model_seed42.pt
  2024: checkpoints/training_prior/best_model_seed2024.pt
  3407: checkpoints/training_prior/best_model_seed3407.pt
